version: '3.8'

services:
  aicte-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aicte-governance-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=aicte-enterprise-secret-key-2026
    volumes:
      - aicte-db-data:/app/src/database
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/pendency/kpis', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aicte-db-data:
    driver: local
