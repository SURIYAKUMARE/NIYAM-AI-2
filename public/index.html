<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIYAM AI — Integrated AICTE Approval Workflow & Compliance Monitoring System</title>
    <link rel="icon" type="image/png" href="/images/aicte-logo.png">
    
    <!-- Theme Early Evaluator to eliminate visual flicker -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('niyam-theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    
    <link rel="stylesheet" href="/styles/theme.css">
</head>
<body>
    <div id="app-root">
        <!-- Rendered by /js/app.js -->
    </div>

    <!-- Application Engine Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
